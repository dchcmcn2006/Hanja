<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>한자 완전정복</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700;900&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#EAE3D2;
    --paper-2:#DED4BC;
    --ink:#26221B;
    --ink-soft:#5B5340;
    --seal:#A6392A;
    --seal-dark:#7E2A1F;
    --gold:#B8862F;
    --jade:#3F6E5B;
    --line: rgba(38,34,27,0.18);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    background-image:
      radial-gradient(circle at 20% 10%, rgba(184,134,47,0.06), transparent 40%),
      radial-gradient(circle at 90% 80%, rgba(63,110,91,0.06), transparent 45%);
    color:var(--ink);
    font-family:'Noto Sans KR', sans-serif;
    min-height:100vh;
    -webkit-tap-highlight-color:transparent;
  }
  #app{
    max-width:480px;
    margin:0 auto;
    padding:18px 16px 40px;
    min-height:100vh;
  }
  .brand{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    margin-bottom:16px;
    padding-bottom:12px;
    border-bottom:2px solid var(--ink);
  }
  .brand h1{
    font-family:'Noto Serif KR',serif;
    font-weight:900;
    font-size:22px;
    margin:0;
    letter-spacing:-0.5px;
  }
  .brand h1 span{color:var(--seal);}
  .brand .count{
    font-size:13px;
    color:var(--ink-soft);
    font-weight:500;
  }
  .stamp{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    border:2.5px solid var(--seal);
    color:var(--seal);
    border-radius:6px;
    font-weight:900;
    font-size:12px;
    padding:2px 8px;
    transform:rotate(-2deg);
  }

  /* ---- HOME ---- */
  .home-card{
    background:var(--paper-2);
    border:1.5px solid var(--line);
    border-radius:10px;
    padding:20px 18px;
    margin-bottom:14px;
  }
  .home-card h2{
    font-family:'Noto Serif KR',serif;
    font-size:17px;
    margin:0 0 6px;
  }
  .home-card p{
    margin:0 0 14px;
    font-size:13.5px;
    color:var(--ink-soft);
    line-height:1.6;
  }
  .progress-track{
    height:10px;
    background:rgba(38,34,27,0.10);
    border-radius:6px;
    overflow:hidden;
    margin-bottom:6px;
  }
  .progress-fill{
    height:100%;
    background:linear-gradient(90deg, var(--jade), #5C9481);
    border-radius:6px;
    transition:width .4s ease;
  }
  .progress-label{font-size:12px; color:var(--ink-soft); margin-bottom:14px;}
  .btn{
    display:block;
    width:100%;
    text-align:center;
    padding:14px;
    border-radius:8px;
    border:none;
    font-family:'Noto Sans KR',sans-serif;
    font-weight:700;
    font-size:15px;
    cursor:pointer;
    margin-bottom:10px;
  }
  .btn-primary{background:var(--ink); color:var(--paper);}
  .btn-seal{background:var(--seal); color:#fff;}
  .btn-ghost{background:transparent; color:var(--ink); border:1.5px solid var(--ink);}
  .btn-jade{background:var(--jade); color:#fff;}
  .btn:disabled{opacity:0.4;}
  .stat-row{display:flex; gap:10px; margin-bottom:14px;}
  .stat-box{
    flex:1;
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:8px;
    padding:10px;
    text-align:center;
  }
  .stat-box b{display:block; font-size:20px; font-family:'Noto Serif KR',serif;}
  .stat-box span{font-size:11px; color:var(--ink-soft);}
  .link-row{display:flex; gap:8px; margin-top:8px;}
  .link-row .btn{margin-bottom:0;}

  /* ---- LIST screen ---- */
  .grade-block{margin-bottom:16px;}
  .grade-title{
    font-family:'Noto Serif KR',serif;
    font-weight:700; font-size:14px;
    margin:0 0 8px;
    color:var(--ink-soft);
    border-left:4px solid var(--gold);
    padding-left:8px;
  }
  .char-grid{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:6px;
  }
  .char-chip{
    aspect-ratio:1;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'Noto Serif KR',serif;
    font-size:18px;
    font-weight:700;
    border:1.5px solid var(--line);
    border-radius:6px;
    background:var(--paper-2);
    position:relative;
  }
  .char-chip.mastered{background:rgba(63,110,91,0.18); border-color:var(--jade); color:var(--jade);}
  .char-chip.weak{background:rgba(166,57,42,0.14); border-color:var(--seal); color:var(--seal-dark);}
  .char-chip.selchip{outline:2.5px solid var(--gold); outline-offset:1px;}

  .word-list{ display:flex; flex-direction:column; gap:6px; }
  .word-chip{
    display:flex; align-items:center; justify-content:center;
    padding:10px 12px;
    border:1.5px solid var(--line);
    border-radius:7px;
    background:var(--paper-2);
  }
  .word-chip .wc-h{ font-family:'Noto Serif KR',serif; font-weight:700; font-size:17px; }
  .word-chip .wc-r{ font-size:13px; color:var(--ink-soft); }
  .word-chip.mastered{background:rgba(63,110,91,0.18); border-color:var(--jade);}
  .word-chip.mastered .wc-h{color:var(--jade);}
  .word-chip.weak{background:rgba(166,57,42,0.14); border-color:var(--seal);}
  .word-chip.weak .wc-h{color:var(--seal-dark);}
  .word-chip.selchip{outline:2.5px solid var(--gold); outline-offset:1px;}

  /* ---- STUDY HEADER (dots + label) ---- */
  .study-top{margin-bottom:16px;}
  .dots{display:flex; gap:5px; margin-bottom:10px; flex-wrap:wrap;}
  .dot{width:9px; height:9px; border-radius:50%; background:rgba(38,34,27,0.18);}
  .dot.done{background:var(--jade);}
  .dot.now{background:var(--seal);}
  .step-label{
    font-size:12.5px;
    font-weight:700;
    color:var(--seal);
    text-transform:none;
    margin-bottom:2px;
  }
  .step-sub{font-size:12px; color:var(--ink-soft);}

  /* ---- FLASHCARD ---- */
  .card-wrap{ margin:22px 0 18px; }
  .flashcard{
    background:var(--paper-2);
    border:2px solid var(--ink);
    border-radius:12px;
    min-height:260px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    padding:20px;
    text-align:center;
  }
  .fc-hanja{font-family:'Noto Serif KR',serif; font-weight:900; font-size:96px; line-height:1;}
  .fc-grade{font-size:11px; color:var(--ink-soft); margin-top:10px;}
  .fc-back{display:none;}
  .flashcard.flipped .fc-front{display:none;}
  .flashcard.flipped .fc-back{display:block;}
  .fc-hun{font-size:26px; font-weight:700; font-family:'Noto Serif KR',serif;}
  .fc-eum{font-size:34px; font-weight:900; color:var(--seal); margin-top:6px;}
  .fc-hint{font-size:12px; color:var(--ink-soft); margin-top:14px;}
  .nav-row{display:flex; gap:10px;}
  .nav-row .btn{flex:1;}

  /* ---- MATCH ---- */
  .match-cols{display:flex; gap:10px; margin:14px 0;}
  .match-col{flex:1; display:flex; flex-direction:column; gap:7px;}
  .match-tile{
    padding:12px 8px;
    text-align:center;
    border:1.5px solid var(--ink);
    border-radius:7px;
    background:var(--paper-2);
    font-weight:700;
    cursor:pointer;
    font-size:14px;
    min-height:20px;
  }
  .match-tile.hanja{font-family:'Noto Serif KR',serif; font-size:22px;}
  .match-tile.sel{background:var(--gold); color:#fff; border-color:var(--gold);}
  .match-tile.matched{background:rgba(63,110,91,0.2); border-color:var(--jade); color:var(--jade); cursor:default;}
  .match-tile.wrongflash{background:rgba(166,57,42,0.25); border-color:var(--seal);}

  /* ---- QUIZ ---- */
  .quiz-q{
    font-size:14px;
    font-weight:500;
    margin:16px 0 10px;
    line-height:1.5;
  }
  .quiz-hanja-big{
    font-family:'Noto Serif KR',serif;
    font-weight:900;
    font-size:72px;
    text-align:center;
    margin:12px 0 18px;
  }
  .opt-btn{
    display:block;
    width:100%;
    text-align:left;
    padding:13px 14px;
    border:1.5px solid var(--ink);
    border-radius:8px;
    background:var(--paper-2);
    font-size:15px;
    font-weight:500;
    margin-bottom:9px;
    cursor:pointer;
  }
  .opt-btn.correct{background:rgba(63,110,91,0.25); border-color:var(--jade); font-weight:700;}
  .opt-btn.wrong{background:rgba(166,57,42,0.2); border-color:var(--seal);}
  .opt-btn.opt-hanja{font-family:'Noto Serif KR',serif; font-size:19px; text-align:center;}
  .opt-btn:disabled{cursor:default;}
  .feedback-line{
    font-size:13px; font-weight:700; margin:10px 0;
    min-height:18px;
  }
  .feedback-line.ok{color:var(--jade);}
  .feedback-line.no{color:var(--seal);}

  /* ---- RESULT ---- */
  .result-score{
    text-align:center;
    font-family:'Noto Serif KR',serif;
    font-size:48px;
    font-weight:900;
    margin:10px 0 4px;
  }
  .result-sub{text-align:center; color:var(--ink-soft); font-size:13px; margin-bottom:18px;}
  .wrong-list{margin-bottom:16px;}
  .wrong-item{
    display:flex; align-items:center; gap:12px;
    padding:9px 4px;
    border-bottom:1px solid var(--line);
  }
  .wrong-item .wh{font-family:'Noto Serif KR',serif; font-size:24px; font-weight:900; width:34px;}
  .wrong-item .wm{font-size:13px;}
  .wrong-item .wm b{color:var(--seal);}

  /* ---- CELEBRATE ---- */
  .celebrate{text-align:center; padding:30px 10px;}
  .seal-final{
    display:inline-flex; align-items:center; justify-content:center;
    width:120px; height:120px;
    border:4px solid var(--seal);
    border-radius:14px;
    color:var(--seal);
    font-family:'Noto Serif KR',serif;
    font-weight:900;
    font-size:34px;
    margin:14px 0 20px;
    transform:rotate(-3deg);
    animation:pop .5s ease;
  }
  @keyframes pop{ 0%{transform:scale(0.4) rotate(-3deg); opacity:0;} 100%{transform:scale(1) rotate(-3deg); opacity:1;} }

  .confirm-box{
    background:rgba(166,57,42,0.08);
    border:1.5px solid var(--seal);
    border-radius:8px;
    padding:14px;
    margin-bottom:12px;
    font-size:13.5px;
  }
  .confirm-row{display:flex; gap:8px; margin-top:10px;}
  .confirm-row .btn{margin-bottom:0;}
  .backlink{
    display:inline-block;
    font-size:12.5px;
    color:var(--ink-soft);
    margin-bottom:14px;
    cursor:pointer;
    text-decoration:underline;
  }
</style>
</head>

const WORDS = WORD_RAW.map(r=>({h:r[0], hun:null, eum:r[1], mean:r[2], grade:'한자어', kind:'word'}));
const N_WORD = WORDS.length;

const ALL = [...HANJA, ...WORDS];
const byH = {}; ALL.forEach(c=>byH[c.h]=c);
const soundGroups = {};
HANJA.forEach(c=>{ (soundGroups[c.eum] = soundGroups[c.eum]||[]).push(c.h); });

/* ============ MIGRATION ============ */
function normalizeState(loaded){
  const base = freshState();
  if(!loaded || typeof loaded !== 'object') return base;
  const s = {...base};

  // old single-deck schema -> new two-deck schema
  if(Array.isArray(loaded.charOrder)) s.charOrder = loaded.charOrder;
  else if(Array.isArray(loaded.order)) s.charOrder = loaded.order;

  if(typeof loaded.charInitialPos === 'number') s.charInitialPos = loaded.charInitialPos;
  else if(typeof loaded.initialPos === 'number') s.charInitialPos = loaded.initialPos;

  if(typeof loaded.charInitialComplete === 'boolean') s.charInitialComplete = loaded.charInitialComplete;
  else if(typeof loaded.initialComplete === 'boolean') s.charInitialComplete = loaded.initialComplete;

  if(Array.isArray(loaded.wordOrder)) s.wordOrder = loaded.wordOrder;
  if(typeof loaded.wordInitialPos === 'number') s.wordInitialPos = loaded.wordInitialPos;
  if(typeof loaded.wordInitialComplete === 'boolean') s.wordInitialComplete = loaded.wordInitialComplete;

  // keep any already-earned progress, but guarantee every current item has a stats entry
  s.stats = {...base.stats, ...(loaded.stats||{})};
  ALL.forEach(c=>{ if(!s.stats[c.h]) s.stats[c.h] = {mastered:false, weak:false}; });

  // if order arrays don't match current data length, regenerate them safely
  if(!Array.isArray(s.charOrder) || s.charOrder.length !== HANJA.length) s.charOrder = base.charOrder;
  if(!Array.isArray(s.wordOrder) || s.wordOrder.length !== WORDS.length) s.wordOrder = base.wordOrder;

  // always resume on the home screen after a version upgrade (mid-batch state isn't safe to carry over)
  s.screen = 'home';
  s.batch = null;
  s.quiz = null;
  s.matchRound = null;
  s.fcIdx = 0;
  s.confirmReset = false;
  s.listSelected = null;

  return s;
}

/* ============ STATE / STORAGE ============ */
const STORE_KEY = 'hanja_progress_v1';
let mem = null; // in-memory fallback
let state = null;

function freshState(){
  const charOrder = HANJA.map((_,i)=>i);
  shuffle(charOrder);
  const wordOrder = WORDS.map((_,i)=>i);
  shuffle(wordOrder);
  const stats = {};
  ALL.forEach(c=> stats[c.h] = {mastered:false, weak:false});
  return {
    charOrder,
    wordOrder,
    stats,
    charInitialPos:0,
    charInitialComplete:false,
    wordInitialPos:0,
    wordInitialComplete:false,
    screen:'home',
    batch:null,            // {kind:'char'|'word', chars:[...], isReview:bool}
    quiz:null,              // {qs:[...], idx:0, score:0, wrongList:[...]}
    matchRound:null,        // transient match state
    fcIdx:0,
    confirmReset:false,
    listSelected:null
  };
}

function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

async function loadState(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(raw){ state = normalizeState(JSON.parse(raw)); return; }
  }catch(e){ /* localStorage unavailable or corrupted JSON */ }
  state = mem || freshState();
}
async function saveState(){
  mem = state;
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }catch(e){ /* ignore */ }
}

/* ============ HELPERS ============ */
function masteredCount(pool){ return pool.filter(c=>state.stats[c.h].mastered).length; }
function weakList(pool){ return pool.filter(c=>state.stats[c.h].weak && !state.stats[c.h].mastered).map(c=>c.h); }
function pickDistractors(pool, field, correctVal, excludeH, count){
  const cand = pool.filter(c=>c.h!==excludeH && c[field]!==correctVal);
  shuffle(cand);
  const out=[]; const seen=new Set([correctVal]);
  for(const c of cand){ if(seen.has(c[field])) continue; seen.add(c[field]); out.push(c[field]); if(out.length>=count) break; }
  return out;
}

function buildQuizForBatch(chars){
  const qs = chars.map(h=>{
    const c = byH[h];
    if(c.kind==='word'){
      const type = Math.random()<0.5 ? 'toReading' : 'toHanja';
      if(type==='toReading'){
        const opts = shuffle([c.eum, ...pickDistractors(WORDS,'eum', c.eum, h, 3)]);
        return {h, type, prompt:`'${c.h}'을(를) 바르게 읽은 것은?`, opts, answer:c.eum, display:c.h, optsAreHanja:false};
      } else {
        const opts = shuffle([c.h, ...pickDistractors(WORDS,'h', c.h, h, 3)]);
        return {h, type, prompt:`'${c.eum}'에 해당하는 한자어는?`, opts, answer:c.h, display:c.eum, optsAreHanja:true};
      }
    }
    const group = soundGroups[c.eum].filter(x=>x!==h);
    const types = ['meaning','sound'];
    if(group.length>0) types.push('sameSound');
    const type = types[Math.floor(Math.random()*types.length)];
    if(type==='meaning'){
      const opts = shuffle([c.hun, ...pickDistractors(HANJA,'hun', c.hun, h, 3)]);
      return {h, type, prompt:`'${c.h}'의 뜻(훈)으로 알맞은 것은?`, opts, answer:c.hun, display:c.h, optsAreHanja:false};
    } else if(type==='sound'){
      const opts = shuffle([c.eum, ...pickDistractors(HANJA,'eum', c.eum, h, 3)]);
      return {h, type, prompt:`'${c.h}'의 음(소리)으로 알맞은 것은?`, opts, answer:c.eum, display:c.h, optsAreHanja:false};
    } else {
      const correctPartner = group[Math.floor(Math.random()*group.length)];
      const others = HANJA.filter(x=>x.eum!==c.eum).map(x=>x.h);
      shuffle(others);
      const opts = shuffle([correctPartner, ...others.slice(0,3)]);
      return {h, type, prompt:`'${c.h}(${c.eum})'과(와) 음이 같은 한자는?`, opts, answer:correctPartner, display:c.h, optsAreHanja:true};
    }
  });
  return qs;
}

/* ============ RENDER ROOT ============ */
function render(scrollTop=true){
  try{
    const app = document.getElementById('app');
    app.innerHTML = header() + screenHTML();
    attachHandlers();
    if(scrollTop) window.scrollTo(0,0);
  }catch(err){
    console.error('render failed', err);
    showRecovery();
  }
}
function showRecovery(){
  const app = document.getElementById('app');
  app.innerHTML = `
  <div class="brand"><h1>한자<span>완전</span>정복</h1></div>
  <div class="confirm-box">
    이전 버전의 저장 기록을 불러오는 중 문제가 발생했어요.<br>학습 기록을 초기화하면 새 버전으로 정상적으로 시작할 수 있어요.
    <div class="confirm-row">
      <button class="btn btn-seal" style="margin:0;" onclick="doReset()">초기화하고 다시 시작</button>
    </div>
  </div>`;
}
function header(){
  const mc = masteredCount(ALL);
  return `<div class="brand">
    <h1>한자<span>완전</span>정복</h1>
    <div class="count">${mc} / ${ALL.length}</div>
  </div>`;
}

function screenHTML(){
  switch(state.screen){
    case 'home': return homeScreen();
    case 'list': return listScreen();
    case 'flash': return flashScreen();
    case 'match': return matchScreen();
    case 'quiz': return quizScreen();
    case 'result': return resultScreen();
    case 'celebrate': return celebrateScreen();
    default: return homeScreen();
  }
}

/* ---------- HOME ---------- */

  const wordWeak = weakList(WORDS);
  const wordPct = Math.round(wordMc/N_WORD*100);

  let charTitle, charDesc, charBtn;

    const remaining = N_CHAR - state.charInitialPos;

    let wordTitle, wordDesc, wordBtn;

      const remaining = N_WORD - state.wordInitialPos;

    } else if(wordWeak.length>0){
      wordTitle = '2단계 · 한자어 (복습 필요)';
      wordDesc = `단어 학습을 모두 마쳤어요! 약점 단어 ${wordWeak.length}개가 남아있어요.`;

/* ---------- LIST ---------- */
function listScreen(){
  const grades = ['8급','7급','6급','준5급'];
  let html = `<span class="backlink" onclick="state.screen='home'; render();">← 홈으로</span>`;
  html += detailPanelHTML();
  grades.forEach(g=>{
    const chars = HANJA.filter(c=>c.grade===g);
    html += `<div class="grade-block"><div class="grade-title">${g} (${chars.length}자)</div><div class="char-grid">`;
    chars.forEach(c=>{
      const st = state.stats[c.h];
      const cls = st.mastered ? 'mastered' : (st.weak ? 'weak' : '');
      const selCls = state.listSelected===c.h ? ' selchip' : '';
      html += `<div class="char-chip ${cls}${selCls}" onclick="selectChar('${c.h}')">${c.h}</div>`;
    });
    html += `</div></div>`;
  });

  html += `<div class="grade-block"><div class="grade-title">한자어 (${WORDS.length}개)</div><div class="word-list">`;
  WORDS.forEach(w=>{
    const st = state.stats[w.h];
    const cls = st.mastered ? 'mastered' : (st.weak ? 'weak' : '');
    const selCls = state.listSelected===w.h ? ' selchip' : '';
    html += `<div class="word-chip ${cls}${selCls}" onclick="selectChar('${w.h}')"><span class="wc-h">${w.h}</span></div>`;
  });
  html += `</div></div>`;

  html += `<p style="font-size:12px;color:var(--ink-soft);">눌러서 뜻/음을 확인하세요. 초록색 = 외운 것 · 빨간색 = 약점</p>`;
  return html;
}
function detailPanelHTML(){
  if(!state.listSelected) return '';
  const c = byH[state.listSelected];
  const st = state.stats[c.h];
  const statusText = st.mastered ? '외운 항목이에요' : (st.weak ? '약점 항목이에요' : '아직 학습 전이에요');
  const statusCls = st.mastered ? 'ok' : (st.weak ? 'no' : '');
  const sizeStyle = c.kind==='word' ? `font-size:${c.h.length>=4?28:c.h.length===3?36:44}px;` : `font-size:56px;`;
  return `
  <div class="home-card" style="margin-bottom:16px; position:sticky; top:8px; z-index:5; box-shadow:0 4px 14px rgba(38,34,27,0.18);">
    <div style="display:flex; align-items:center; gap:16px;">
      <div class="fc-hanja" style="${sizeStyle}">${c.h}</div>
      <div>
        ${c.kind==='char' ? `<div class="fc-hun" style="font-size:20px;">${c.hun}</div>` : ''}
        <div class="fc-eum" style="font-size:24px; margin-top:2px;">${c.eum}</div>
      </div>
    </div>
    ${c.kind==='word' ? `<p style="font-size:13.5px; color:var(--ink-soft); margin:10px 0 0; line-height:1.55;">${c.mean}</p>` : ''}
    <div class="feedback-line ${statusCls}" style="margin-top:10px;">${statusText} · ${c.grade}</div>
    ${st.mastered ? `<button class="btn btn-seal" style="margin-top:8px;" onclick="markForgot('${c.h}')">사실 기억이 안 나요 (약점으로 표시)</button>` : ''}
    <button class="btn btn-ghost" style="margin-top:0;" onclick="state.listSelected=null; render(false);">닫기</button>
  </div>`;
}
function selectChar(h){
  state.listSelected = (state.listSelected===h) ? null : h;
  render(false);
}
function markForgot(h){
  state.stats[h].mastered = false;
  state.stats[h].weak = true;
  saveState().then(()=>render(false));
}

/* ---------- BATCH START ---------- */
function startNextBatch(kind, isReview){
  const pool = kind==='char' ? HANJA : WORDS;
  const order = kind==='char' ? state.charOrder : state.wordOrder;
  const pos = kind==='char' ? state.charInitialPos : state.wordInitialPos;
  let chars;
  if(isReview){
    let wl = weakList(pool);
    shuffle(wl);
    chars = wl.slice(0,10);
  } else {
    chars = order.slice(pos, pos+10).map(i=>pool[i].h);
  }
  state.batch = {kind, chars, isReview};
  state.fcIdx = 0;
  state.screen = 'flash';
  saveState().then(render);
}

/* ---------- FLASHCARD STEP ---------- */
function flashScreen(){
  const chars = state.batch.chars;
  const h = chars[state.fcIdx];
  const c = byH[h];
  const dots = dotsHTML(chars.length, state.fcIdx, []);
  const isWord = c.kind==='word';
  const hanjaSize = isWord ? (c.h.length>=4?54:c.h.length===3?66:84) : 96;
  return `
  <div class="study-top">
    <div class="dots">${dots}</div>
    <div class="step-label">1단계 · 카드로 익히기</div>
    <div class="step-sub">${isWord ? '카드를 눌러 독음(읽는 소리)을 확인하세요' : '카드를 눌러 훈(뜻)과 음(소리)을 확인하세요'} (${state.fcIdx+1}/${chars.length})</div>
  </div>
  <div class="card-wrap">
    <div class="flashcard" id="fc" onclick="flipCard()">
      <div class="fc-front">
        <div class="fc-hanja" style="font-size:${hanjaSize}px;">${c.h}</div>
        <div class="fc-grade">${c.grade}</div>
      </div>
      <div class="fc-back">
        ${isWord ? '' : `<div class="fc-hun">${c.hun}</div>`}
        <div class="fc-eum">${c.eum}</div>
        ${isWord ? `<p style="font-size:13px; color:var(--ink-soft); margin:10px 0 0; line-height:1.5;">${c.mean}</p>` : ''}
        <div class="fc-hint">탭하면 다시 한자가 보여요</div>
      </div>
    </div>
  </div>
  <div class="nav-row">
    <button class="btn btn-ghost" onclick="fcPrev()" ${state.fcIdx===0?'disabled':''}>이전</button>
    <button class="btn btn-primary" onclick="fcNext()">${state.fcIdx===chars.length-1?'다음 단계로':'다음 카드'}</button>
  </div>
  `;
}
function flipCard(){ document.getElementById('fc').classList.toggle('flipped'); }
function fcPrev(){ if(state.fcIdx>0){ state.fcIdx--; render(); } }
function fcNext(){
  if(state.fcIdx < state.batch.chars.length-1){ state.fcIdx++; render(); }
  else {
    if(state.batch.kind==='char') startMatchRound('hun', '뜻');
    else startMatchRound('eum', '독음(소리)');
  }
}

/* ---------- MATCH STEP ---------- */
function startMatchRound(field, label){
  const chars = [...state.batch.chars];
  const left = shuffle([...chars]);
  const right = shuffle([...chars]);
  state.matchRound = {field, label, left, right, matched:[], selL:null, selR:null};
  state.screen = 'match';
  render();
}
function matchScreen(){
  const m = state.matchRound;
  const doneAll = m.matched.length === m.left.length;
  const leftTiles = m.left.map(h=>{
    const cls = ['match-tile','hanja'];
    if(m.matched.includes(h)) cls.push('matched');
    else if(m.selL===h) cls.push('sel');
    const fs = h.length>=4?14:h.length===3?16:22;
    return `<div class="${cls.join(' ')}" style="font-size:${fs}px;" onclick="matchPick('L','${h}')">${h}</div>`;
  }).join('');
  const rightTiles = m.right.map(h=>{
    const val = m.field==='hun'?byH[h].hun:byH[h].eum;
    const cls = ['match-tile'];
    if(m.matched.includes(h)) cls.push('matched');
    else if(m.selR===h) cls.push('sel');
    return `<div class="${cls.join(' ')}" onclick="matchPick('R','${h}')">${val}</div>`;
  }).join('');

  return `
  <div class="study-top">
    <div class="step-label">2단계 · ${m.label} 짝맞추기</div>
    <div class="step-sub">한자(어)와 ${m.label}을(를) 순서대로 눌러 짝을 맞춰보세요 (${m.matched.length}/${m.left.length})</div>
  </div>
  <div class="match-cols">
    <div class="match-col">${leftTiles}</div>
    <div class="match-col">${rightTiles}</div>
  </div>
  ${doneAll ? `<button class="btn btn-primary" onclick="matchNext()">다음 단계로</button>` : ''}
  `;
}
function matchPick(side, h){
  const m = state.matchRound;
  if(m.matched.includes(h)) return;
  if(side==='L') m.selL = (m.selL===h)?null:h;
  else m.selR = (m.selR===h)?null:h;
  if(m.selL && m.selR){
    if(m.selL===m.selR){
      m.matched.push(m.selL);
      m.selL=null; m.selR=null;
      render();
    } else {
      const badL=m.selL, badR=m.selR;
      render();
      setTimeout(()=>{
        const l = [...document.querySelectorAll('.match-col')[0].children];
        const r = [...document.querySelectorAll('.match-col')[1].children];
        m.selL=null; m.selR=null;
        render();
      }, 450);
    }
  } else {
    render();
  }
}
function matchNext(){
  if(state.batch.kind==='char' && state.matchRound.field==='hun'){
    startMatchRound('eum','음(소리)');
  } else {
    buildAndStartQuiz();
  }
}

/* ---------- QUIZ STEP ---------- */
function buildAndStartQuiz(){
  const qs = buildQuizForBatch(state.batch.chars);
  state.quiz = {qs, idx:0, score:0, wrongList:[], answered:false, chosen:null};
  state.screen='quiz';
  saveState().then(render);
}
function quizScreen(){
  const q = state.quiz.qs[state.quiz.idx];
  const dots = dotsHTML(state.quiz.qs.length, state.quiz.idx, state.quiz.wrongList.map(w=>state.quiz.qs.findIndex(x=>x.h===w.h)));
  const optsHTML = q.opts.map(o=>{
    let cls='opt-btn';
    if(q.optsAreHanja) cls += ' opt-hanja';
    if(state.quiz.answered){
      if(o===q.answer) cls+=' correct';
      else if(o===state.quiz.chosen) cls+=' wrong';
    }
    return `<button class="${cls}" ${state.quiz.answered?'disabled':''} onclick="answerQuiz('${escapeQ(o)}')">${o}</button>`;
  }).join('');
  let fb='';
  if(state.quiz.answered){
    const ok = state.quiz.chosen===q.answer;
    fb = `<div class="feedback-line ${ok?'ok':'no'}">${ok?'정답이에요! 👍':'다시 확인해요 — 정답은 \''+q.answer+'\''}</div>`;
  }
  const isLast = state.quiz.idx === state.quiz.qs.length-1;
  const displaySize = q.display.length>=4?40:q.display.length===3?52:q.display.length<=1?72:60;
  return `
  <div class="study-top">
    <div class="dots">${dots}</div>
    <div class="step-label">3단계 · 미니테스트</div>
    <div class="step-sub">${state.quiz.idx+1} / ${state.quiz.qs.length}번 문제</div>
  </div>
  <div class="quiz-hanja-big" style="font-size:${displaySize}px;">${q.display}</div>
  <div class="quiz-q">${q.prompt}</div>
  ${optsHTML}
  ${fb}
  ${state.quiz.answered ? `<button class="btn btn-primary" onclick="nextQuizQ()">${isLast?'결과 보기':'다음 문제'}</button>` : ''}
  `;
}
function escapeQ(s){ return s.replace(/'/g,"\\'"); }
function answerQuiz(chosen){
  if(state.quiz.answered) return;
  const q = state.quiz.qs[state.quiz.idx];
  state.quiz.chosen = chosen;
  state.quiz.answered = true;
  const ok = chosen===q.answer;
  if(ok) state.quiz.score++;
  else {
    const item = byH[q.h];
    state.quiz.wrongList.push({h:q.h, hun:item.hun, eum:item.eum, kind:item.kind});
  }

  // update stats
  const st = state.stats[q.h];
  if(ok){ st.mastered = true; st.weak = false; }
  else { st.weak = true; if(!state.batch.isReview) st.mastered = false; }
  render();
}
function nextQuizQ(){
  if(state.quiz.idx < state.quiz.qs.length-1){
    state.quiz.idx++;
    state.quiz.answered=false;
    state.quiz.chosen=null;
    render();
  } else {
    if(!state.batch.isReview){
      if(state.batch.kind==='char'){
        state.charInitialPos += state.batch.chars.length;
        if(state.charInitialPos >= N_CHAR) state.charInitialComplete = true;
      } else {
        state.wordInitialPos += state.batch.chars.length;
        if(state.wordInitialPos >= N_WORD) state.wordInitialComplete = true;
      }
    }
    state.screen='result';
    saveState().then(render);
  }
}

/* ---------- RESULT ---------- */
function resultScreen(){
  const q = state.quiz;
  const wrongHTML = q.wrongList.length ? q.wrongList.map(w=>{
    const wSize = w.kind==='word' ? `font-size:${w.h.length>=4?14:w.h.length===3?16:20}px;width:auto;min-width:34px;` : '';
    const wMeaning = w.kind==='word' ? `<b>${w.eum}</b> · ${byH[w.h].mean}` : `<b>${w.hun}</b> · ${w.eum}`;
    return `
    <div class="wrong-item">
      <div class="wh" style="${wSize}">${w.h}</div>
      <div class="wm">${wMeaning}</div>
    </div>`;
  }).join('') : `<p style="font-size:13px;color:var(--ink-soft);">틀린 문제가 없어요, 완벽해요!</p>`;

  const kind = state.batch.kind;
  const pool = kind==='char' ? HANJA : WORDS;
  const weak = weakList(pool);
  const initialComplete = kind==='char' ? state.charInitialComplete : state.wordInitialComplete;
  const label = kind==='char' ? '한자' : '단어';

  let nextBtnHTML;
  if(state.batch.isReview){
    if(weak.length>0){
      nextBtnHTML = `<button class="btn btn-seal" onclick="startNextBatch('${kind}',true)">약점 ${label} 계속 복습하기</button>`;
    } else if(kind==='char' && !state.wordInitialComplete){
      nextBtnHTML = `<button class="btn btn-primary" onclick="state.screen='home'; render();">2단계 한자어 학습으로 이동</button>`;
    } else {
      nextBtnHTML = `<button class="btn btn-primary" onclick="state.screen='celebrate'; render();">🎉 완전정복 확인하기</button>`;
    }
  } else if(!initialComplete){
    nextBtnHTML = `<button class="btn btn-primary" onclick="startNextBatch('${kind}',false)">다음 10개 학습하기</button>`;
  } else if(weak.length>0){
    nextBtnHTML = `<button class="btn btn-seal" onclick="startNextBatch('${kind}',true)">1차 학습 완료! 약점 복습 시작</button>`;
  } else if(kind==='char'){
    nextBtnHTML = `<button class="btn btn-primary" onclick="state.screen='home'; render();">2단계 한자어 학습으로 이동</button>`;
  } else {
    nextBtnHTML = `<button class="btn btn-primary" onclick="state.screen='celebrate'; render();">🎉 완전정복 확인하기</button>`;
  }

  return `
  <div class="study-top">
    <div class="step-label">${state.batch.isReview?'복습':'미니테스트'} 결과</div>
  </div>
  <div class="result-score">${q.score} / ${q.qs.length}</div>
  <div class="result-sub">${scoreMsg(q.score,q.qs.length)}</div>
  <div class="wrong-list">${wrongHTML}</div>
  ${nextBtnHTML}
  <button class="btn btn-ghost" onclick="state.screen='home'; render();">홈으로</button>
  `;
}
function scoreMsg(s,t){
  const r = s/t;
  if(r===1) return '10문제를 모두 맞혔어요!';
  if(r>=0.8) return '아주 잘했어요, 조금만 더 다지면 완벽해요.';
  if(r>=0.5) return '반은 넘었어요. 약점 한자는 나중에 다시 복습할 거예요.';
  return '아직 낯선 한자가 많아요. 복습 모드에서 다시 만나요.';
}

/* ---------- CELEBRATE ---------- */
function celebrateScreen(){
  return `
  <div class="celebrate">
    <div class="seal-final">完成</div>
    <h2 style="font-family:'Noto Serif KR',serif; margin:0 0 10px;">한자 ${N_CHAR}자 + 한자어 ${N_WORD}개 완전정복!</h2>
    <p style="font-size:14px; color:var(--ink-soft); line-height:1.6;">8급부터 준5급 한자, 그리고 준5급 한자어까지<br>모두 익히고 외웠어요. 정말 잘했어요!</p>
    <button class="btn btn-ghost" style="margin-top:16px;" onclick="state.screen='list'; render();">전체 목록 다시 보기</button>
    <button class="btn btn-seal" onclick="state.screen='home'; render();">홈으로</button>
  </div>`;
}

/* ---------- SHARED UI ---------- */
function dotsHTML(total, cur, wrongIdxs){
  let html='';
  for(let i=0;i<total;i++){
    let cls='dot';
    if(i<cur) cls += wrongIdxs.includes(i) ? ' now' : ' done';
    else if(i===cur) cls+=' now';
    html += `<div class="${cls}"></div>`;
  }
  return html;
}

function doReset(){
  state = freshState();
  saveState().then(render);
}

function attachHandlers(){ /* using inline onclick, nothing extra needed */ }

/* ============ BOOT ============ */
loadState().then(render);
</script>
</body>
</html>
